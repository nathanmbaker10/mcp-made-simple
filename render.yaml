# Deploys the Lesson 1 greeting server so a remote Gemini client can call it.
# In the Render Dashboard: New > Blueprint, then select this repository.
# Render asks for MCP_AUTH_TOKEN because sync is false. Keep that value out of git.
services:
  - type: web
    name: mcp-greeting
    runtime: node
    plan: free
    rootDir: lesson1/server
    # Runs in lesson1/server. package-lock.json is committed there, so this uses npm ci.
    # A checkout without that lockfile uses npm install instead of failing.
    buildCommand: "if [ -f package-lock.json ]; then npm ci; else npm install; fi && npm run build"
    startCommand: npm run start:http
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: MCP_AUTH_TOKEN
        sync: false
